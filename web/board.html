<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kaizen</title>
<style>
:root{--bg:#f6f8fc;--bg-2:#fff;--line:#d9e0ee;--ink:#0c162f;--ink-hi:#0c162f;--dim:#5b6b8c;--accent:#2d50a5;--run:#0f8fa3;--ok:#1f9d55;--warn:#a8720a;--danger:#c8322f;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c162f;--bg-2:#121e3c;--line:#22305a;--ink:#eef2fa;--ink-hi:#deeeff;--dim:#96aacd;--accent:#486ed9;--run:#4fd6e6;--ok:#5fd28a;--warn:#e6b450;--danger:#e85050;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0c162f;--bg-2:#121e3c;--line:#22305a;--ink:#eef2fa;--ink-hi:#deeeff;--dim:#96aacd;--accent:#486ed9;--run:#4fd6e6;--ok:#5fd28a;--warn:#e6b450;--danger:#e85050;color-scheme:dark}
*{box-sizing:border-box}
:root{--r:6px;--r-s:4px}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,"JetBrains Mono","Cascadia Code","SF Mono",Menlo,Consolas,monospace;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit;background:none;border:0;padding:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}

/* header */
.hdr{display:flex;align-items:center;gap:16px;padding:10px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
pre.mark{margin:0;font-size:8px;line-height:1;font-weight:700}
pre.mark span:nth-child(1){color:var(--ink-hi)}pre.mark span:nth-child(2){color:color-mix(in srgb,var(--ink-hi),var(--accent))}pre.mark span:nth-child(3){color:var(--accent)}
.sel{border:1px solid var(--line);border-radius:var(--r);padding:5px 8px;background:var(--bg-2);cursor:pointer;color:var(--ink);appearance:auto;font-size:13px}
.sp{flex:1}
.ib{width:34px;height:34px;display:grid;place-items:center;color:var(--dim);border:1px solid transparent;border-radius:var(--r)}
.ib:hover{color:var(--ink);border-color:var(--line)}
.ib.pri{color:var(--accent)}
.ib.sm{width:26px;height:26px}.ib.sm svg{width:15px;height:15px}
.btn{border:1px solid var(--line);border-radius:var(--r);padding:5px 12px;color:var(--ink);background:var(--bg-2);min-height:30px;font-size:13px}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.warn{border-color:var(--warn);color:var(--warn)}.btn.warn:hover{background:var(--warn);color:var(--bg)}
.btn.danger{color:var(--danger)}.btn.danger:hover{border-color:var(--danger)}
.btn.ghost{background:none;border-color:transparent;color:var(--dim)}.btn.ghost:hover{color:var(--ink);border-color:var(--line)}

/* summary strip */
.strip{display:flex;gap:18px;padding:8px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;font-size:13px;color:var(--dim)}
.strip button{color:var(--dim);padding:2px 8px;border-radius:var(--r-s)}
.strip button:hover,.strip button.on{color:var(--ink);background:color-mix(in srgb,var(--dim) 12%,transparent)}
.strip button.attn{color:var(--warn)}

/* board */
main{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:20px;padding:0 24px 16px;overflow:auto;align-content:start}
section h2::before{content:"";display:block;height:16px;margin-top:-16px}
section{padding-top:16px}
section h2{margin:0;font-size:12px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px;height:30px;position:sticky;top:0;background:var(--bg);z-index:1}
section h2 i{font-style:normal;font-weight:400}
section h2 .ib{margin-left:auto}
ul{list-style:none;margin:0;padding:8px 0 0;display:flex;flex-direction:column;gap:8px}

/* card, Linear grammar in our palette
     line 1  status icon · id (dim mono) · ⋯ menu on hover
     line 2  title, regular weight, wraps to 2 lines
     line 3  chips, only when set
   Card ground is --bg-2 on a --bg column. Actions never sit on the card. */
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.card:hover{border-color:var(--dim)}
.card.open{border-color:var(--accent)}
.card.archived .c-title,.card.archived .c-id{opacity:.7}
section h2 .clear{margin-left:auto;min-height:22px;padding:0 8px}
.c-id{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);min-height:20px}
.c-id .st{width:14px;height:14px;display:grid;place-items:center;flex-shrink:0}
.c-id .st svg{width:14px;height:14px;stroke-width:1.8}
.c-id .idt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.c-id .age{font-variant-numeric:tabular-nums}
.c-id .more{display:none;margin:-4px -6px -4px 0}
.card:hover .more,.card:focus-within .more,.card.menu .more{display:grid}
.card:hover .age,.card.menu .age{display:none}
.c-title{font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.c-chips{display:flex;gap:6px;flex-wrap:wrap}
.c-chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-s);font-size:11px;color:var(--dim);background:color-mix(in srgb,var(--dim) 12%,transparent)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.chip svg{width:11px;height:11px;stroke-width:1.7}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}.chip.warn i{background:var(--warn)}
.chip.accent{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}.chip.accent i{background:var(--accent)}
.chip.run{color:var(--run);background:color-mix(in srgb,var(--run) 14%,transparent)}.chip.run i{background:var(--run)}
.st.d-idea{color:var(--dim)}.st.d-run{color:var(--run)}.st.d-stall{color:var(--dim)}.st.d-wait{color:var(--warn)}.st.d-done{color:var(--ok)}.st.d-aband{color:var(--dim)}
.d-run{color:var(--run)}.d-wait{color:var(--warn)}.d-done{color:var(--ok)}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;vertical-align:middle}
.d-run .pulse,.st.d-run svg{animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.35}}
/* hover menu */
.menu-pop{position:absolute;right:8px;top:30px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:4px;z-index:3;min-width:140px;display:flex;flex-direction:column}
.menu-pop button{text-align:left;padding:6px 10px;font-size:12px;color:var(--ink);border-radius:var(--r-s);display:flex;gap:8px;align-items:center}
.menu-pop button:hover{background:color-mix(in srgb,var(--dim) 12%,transparent)}
.menu-pop button.danger{color:var(--danger)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.more-btn{width:100%;padding:8px;color:var(--dim);font-size:12px;border:1px dashed var(--line);border-radius:var(--r)}
.more-btn:hover{color:var(--ink);border-color:var(--dim)}

/* inline forms replace a card while editing */
.inl{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--bg-2);border:1px solid var(--accent);border-radius:var(--r)}
.inl input{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;background:var(--bg-2)}
.inl input::placeholder{color:var(--dim)}
.inl .row{display:flex;gap:6px;justify-content:flex-end}
.inl .q{font-size:13px}.inl .q.dim{color:var(--dim)}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:60px;color:var(--dim)}

/* footer */
.ftr{display:flex;justify-content:space-between;gap:16px;padding:8px 24px;border-top:1px solid var(--line);color:var(--dim);font-size:12px;flex-wrap:wrap;align-items:center}
.ftr span+span{margin-left:14px}.ftr .st svg{width:12px;height:12px}
.ftr a{color:var(--dim);cursor:pointer;text-decoration:underline}

/* side panel */
.scrim{position:fixed;inset:0;z-index:10;background:color-mix(in srgb,var(--bg) 55%,transparent);display:none}
.scrim.on{display:block}
aside{position:fixed;top:0;right:0;bottom:0;z-index:11;width:480px;max-width:100%;background:var(--bg-2);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s}
aside.open{transform:none}
aside header{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
aside header .t{flex:1;min-width:0}
aside header b{display:block;font-size:15px}
aside header .sub{color:var(--dim);font-size:12px;margin-top:2px}
aside nav{display:flex;border-bottom:1px solid var(--line);padding-inline:8px}
aside nav:empty{display:none}
aside nav button{padding:10px 12px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
aside nav button:hover{color:var(--ink)}
aside nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
aside .body{padding:20px;overflow:auto;flex:1}
aside .foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
aside .foot:empty{display:none}
.md h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:18px 0 6px}.md h3:first-child{margin-top:0}
.md p{margin:0 0 10px;max-width:62ch}.md ol,.md ul{padding-left:1.4em;margin:0 0 10px}.md li{margin:3px 0}
.md pre{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;overflow-x:auto;margin:0 0 8px;font-size:12px}
.md h1,.md h2{font-size:13px;margin:16px 0 6px}.md h1:first-child,.md h2:first-child{margin-top:0}.md code{background:var(--bg);padding:0 4px;border-radius:var(--r-s)}.md table{border-collapse:collapse;font-size:12px;margin:0 0 10px}.md td,.md th{border:1px solid var(--line);padding:3px 8px;text-align:left}.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.find{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px;align-items:flex-start}
.find input{margin-top:4px}
.find .sev{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--warn)}.find .sev.hi{color:var(--danger)}
.find .loc{color:var(--dim);font-size:12px;margin-left:8px}
.set{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;align-items:center;font-size:13px}
.set label{color:var(--dim)}
.set .opts{display:flex;gap:4px}
.set .opts button{border:1px solid var(--line);border-radius:var(--r);padding:3px 10px;color:var(--dim)}
.set .opts button.on{color:var(--ink);border-color:var(--ink)}
.toast{position:fixed;z-index:12;left:24px;bottom:52px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:8px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.help{position:fixed;inset:0;z-index:12;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.help.on{display:flex}.help div{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;line-height:2}
.help kbd{display:inline-block;width:7ch;color:var(--accent)}
@media(max-width:900px){main{grid-template-columns:1fr;padding-inline:16px;gap:8px}.hdr,.strip,.ftr{padding-inline:16px}section h2{position:sticky;top:0;background:var(--bg);z-index:1}.more{display:grid}.card:hover .age{display:inline}}
@media(prefers-reduced-motion:reduce){aside,.toast,.mascot,.d-run .pulse{transition:none;animation:none}}
</style>

<script>
// The page never touches the filesystem. Everything comes from /state and the run
// files behind /run/:id; every change goes through a POST and comes back as an SSE
// tick that reloads the board. See design.md for the visual rules.
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const ico=n=>`<svg><use href="#i-${n}"/></svg>`;
const m=60e3,h=3600e3,d=86400e3;
const age=(t,now)=>{const x=now-t;return x<h?Math.round(x/m)+"m":x<d?Math.round(x/h)+"h":Math.round(x/d)+"d"};
const NAMES={claude:"Claude Code",codex:"Codex",agy:"Antigravity",opencode:"OpenCode",gemini:"Gemini",cursor:"Cursor"};
const MARKS={claude:1,codex:1,agy:1,opencode:1,gemini:1,cursor:1,full:1,lite:1};
const COLS=["Ideas","Planning","Building","Review","Done"];
// state.ts statuses onto the icon set in the <defs> above.
const ICON={idea:"idea",starting:"start",running:"run",stalled:"stall",waiting:"wait",done:"done",abandoned:"aband"};
const WORD={idea:"idea",starting:"starting",running:"running",stalled:"stalled",waiting:"waiting on you",done:"done",abandoned:"abandoned"};

let S={project:null,projects:[],cards:[],now:Date.now(),all:false};
let all=new URLSearchParams(location.search).get("all")==="1",openKey=null,mode=null,modeKey=null,filter=null,menuKey=null,tab=0,runDoc=null;
// A column shows this many cards, then a "more" line; Done is where it matters.
const FOLD=6;const unfolded=new Set();
let archive=false;                                   // showing the archive instead of the board
const wasAwaiting=new Map();let first=true;

const key=c=>c.kind==="idea"?"idea:"+c.state+":"+c.text:"run:"+c.state+":"+c.id;

async function load(){
 const r=await fetch("/state"+(all?"?all=1":""));S=await r.json();
 for(const c of S.cards){if(c.kind!=="run")continue;const k=key(c),before=wasAwaiting.get(k);
  if(!first&&before===null&&c.awaiting)notifyUser("kaizen — waiting on you",c.text+" · "+c.awaiting);wasAwaiting.set(k,c.awaiting)}
 first=false;render();
 if(openKey&&runDoc){const c=S.cards.find(x=>key(x)===openKey);if(c)openRun(c,true)}}
async function post(path,body){const r=await fetch(path,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||j.why||"failed");if(j.manual)console.log("run manually:",j.manual)}return j}

function card(c){
 const k=key(c),el=document.createElement("div");el.className="card"+(k===openKey?" open":"")+(k===menuKey?" menu":"")+(c.archived?" archived":"");el.tabIndex=0;el.setAttribute("role","button");
 const st=ICON[c.status]||"idea",idt=c.kind==="idea"?"idea":c.text;
 const chips=[];
 if(c.status==="waiting")chips.push(`<span class="chip warn"><i></i>${esc(c.awaiting||"needs you")}</span>`);
 else if(c.status==="running")chips.push(`<span class="chip run"><i></i>running</span>`);
 if(all)chips.push(`<span class="chip">${esc(c.where)}</span>`);
 el.innerHTML=`<div class="c-id"><span class="st d-${st}"><svg><use href="#s-${st}"/></svg></span><span class="idt">${esc(idt)}</span><span class="age">${c.kind==="run"?age(c.moved||S.now,S.now):""}</span><button class="ib sm more" data-a="menu" title="Actions" aria-label="Actions">${ico("more")}</button></div>
  <div class="c-title">${esc(c.kind==="idea"?c.text:(c.title||c.id))}</div>
  <div class="c-chips">${chips.join("")}</div>`;
 if(k===menuKey){
  const items=[];
  if(archive){items.push(["restore","Restore",ico("play")]);if(c.kind==="run")items.push(["open","Open",ico("play")]);}
  else if(c.kind==="idea"&&c.status==="idea")items.push(["run","Run",ico("play")],["edit","Edit",ico("pen")],["reject","Reject",ico("x")],null,["delete","Delete",ico("trash"),"danger"]);
  else if(c.kind==="idea")items.push(["delete","Remove",ico("trash"),"danger"]);
  else if(c.status==="waiting"||c.status==="running"||c.status==="stalled")items.push(["open","Open",ico("play")],null,["reject","Abandon",ico("x"),"danger"]);
  else items.push(["open","Open",ico("play")]);
  if(!archive&&!(c.kind==="idea"&&c.status!=="idea"))items.push(null,["archive","Archive",ico("x")]);
  el.innerHTML+=`<div class="menu-pop">${items.map(i=>i?`<button data-a="${i[0]}" class="${i[3]||""}">${i[2]}${i[1]}</button>`:"<hr>").join("")}</div>`}
 el.querySelectorAll("[data-a]").forEach(bt=>bt.onclick=async e=>{e.stopPropagation();const a=bt.dataset.a;menuKey=null;if(a==="menu"){menuKey=k;render();return}if(a==="open"){open(c);return}
  if(a==="archive"||a==="restore"){const r=await post("/archive",c.kind==="idea"?{dir:c.state,text:c.text,archived:a==="archive"}:{dir:c.state,id:c.id,archived:a==="archive"});if(r.ok)toast(a==="archive"?"Archived":"Restored");load();return}
  mode=a;modeKey=k;render()});
 el.onclick=()=>{if(menuKey){menuKey=null;render();return}open(c)};el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open(c)}};
 return el;}

function inlineForm(c){
 const li=document.createElement("li");li.className="inl";const dir=c.state;
 if(mode==="edit"){li.innerHTML=`<input value="${esc(c.text)}"><div class="row"><button class="btn ghost" data-a="c">Cancel</button><button class="btn pri" data-a="s">Save</button></div>`;li.querySelector('[data-a=s]').onclick=async()=>{const next=li.querySelector("input").value.trim();mode=null;if(next&&next!==c.text)await post("/inbox",{op:"edit",dir,text:c.text,next});load()}}
 if(mode==="reject"){const idea=c.kind==="idea";li.innerHTML=`<div class="q">${idea?"Reject this idea?":"Abandon this run?"} The reason is recorded.</div><input placeholder="Reason"><div class="row"><button class="btn ghost" data-a="c">Keep it</button><button class="btn warn" data-a="s">${idea?"Reject":"Abandon"}</button></div>`;li.querySelector('[data-a=s]').onclick=async()=>{const why=li.querySelector("input").value.trim();if(!why){toast("A reason is required");return}mode=null;const r=idea?await post("/inbox",{op:"reject",dir,text:c.text,reason:why}):await post("/abort",{dir,id:c.id,why});if(r.ok)toast(idea?"Rejected":"Abandoned, reason recorded");load()}}
 if(mode==="delete"){li.innerHTML=`<div class="q">Delete "${esc(c.text)}"?</div><div class="q dim">Not recorded anywhere.</div><div class="row"><button class="btn ghost" data-a="c">Keep it</button><button class="btn danger" data-a="s">Delete</button></div>`;li.querySelector('[data-a=s]').onclick=async()=>{mode=null;const r=await post("/inbox",{op:"delete",dir,text:c.text});if(r.ok)toast("Deleted");load()}}
 if(mode==="run"){li.innerHTML=`<div class="q">Start a run for "${esc(c.text)}"</div><div class="q dim">Opens your agent in a new terminal with the request typed in.</div><div class="row"><button class="btn ghost" data-a="c">Cancel</button><button class="btn" data-a="l">Lite</button><button class="btn pri" data-a="s">Full run</button></div>`;li.querySelector('[data-a=s]').onclick=()=>startRun(c,"full");li.querySelector('[data-a=l]').onclick=()=>startRun(c,"lite")}
 li.querySelector('[data-a=c]').onclick=()=>{mode=null;render()};
 const inp=li.querySelector("input");if(inp){inp.onkeydown=e=>{if(e.key==="Enter")li.querySelector('[data-a=s]').click();if(e.key==="Escape"){mode=null;render()}};setTimeout(()=>inp.focus())}
 return li;}

async function startRun(c,kind){
 mode=null;askNotify();
 const r=await post("/run",{dir:c.state,text:c.text,kind});
 if(r.ok)toast(kind+" run opened in your terminal: "+r.agent.name);
 load()}

function render(){
 const cs=S.cards.filter(c=>c.archived===archive),b=$("board");b.innerHTML="";
 const nArch=S.cards.filter(c=>c.archived).length;
 const n=s=>cs.filter(c=>c.status===s).length;
 const strip=[];
 if(n("waiting"))strip.push(`<button class="attn ${filter==="waiting"?"on":""}" data-f="waiting">● ${n("waiting")} waiting on you</button>`);
 strip.push(`<button class="${filter==="running"?"on":""}" data-f="running"><span class="d-run"><span class="pulse"></span></span> ${n("running")} running</button>`);
 if(n("stalled"))strip.push(`<button class="${filter==="stalled"?"on":""}" data-f="stalled">◐ ${n("stalled")} stalled</button>`);
 strip.push(`<span class="sp"></span><span>${cs.filter(c=>c.kind==="idea").length} ideas · ${cs.filter(c=>c.kind==="run").length} runs</span>`,`<button class="${archive?"on":""}" data-f="__archive">${archive?"Back to board":"Archive "+nArch}</button>`);
 $("strip").innerHTML=strip.join("");
 $("strip").querySelectorAll("button").forEach(c=>c.onclick=()=>{if(c.dataset.f==="__archive"){archive=!archive;filter=null;render();return}filter=filter===c.dataset.f?null:c.dataset.f;render()});
 const sel=$("proj");sel.innerHTML=(S.project?`<option value="cur">${esc(S.project)}</option>`:"")+`<option value="all">All projects</option>`;sel.value=all||!S.project?"all":"cur";
 if(!cs.length&&mode!=="new"){b.innerHTML=archive?'<div class="empty"><div class="mascot"></div><div>Nothing archived.</div></div>':'<div class="empty"><div class="mascot"></div><div>Nothing here yet.</div><button class="btn pri" id="newempty">New idea</button></div>';if(!archive)$("newempty").onclick=()=>{mode="new";render()};}
 COLS.forEach((name,ci)=>{
  const s=document.createElement("section");const list=cs.filter(c=>c.column===ci&&(!filter||c.status===filter));
  const clearable=ci===4&&!archive&&list.length;
  s.innerHTML=`<h2>${name}<i>${list.length||""}</i>${ci===0&&!archive?`<button class="ib sm" title="New idea" aria-label="New idea">${ico("plus")}</button>`:""}${clearable?`<button class="btn sm ghost clear" title="Move every finished run here to the archive">Clear</button>`:""}</h2>`;
  if(ci===0&&!archive)s.querySelector(".ib").onclick=()=>{mode="new";render()};
  if(clearable)s.querySelector(".clear").onclick=async()=>{for(const c of list)await post("/archive",{dir:c.state,id:c.id});toast("Archived "+list.length);load()};
  const ul=document.createElement("ul");
  if(ci===0&&mode==="new"){const f=document.createElement("li");f.className="inl";f.innerHTML=`<input id="newidea" placeholder="One line, like a commit subject"><div class="row"><button class="btn ghost" id="nc">Cancel</button><button class="btn pri" id="ns">Add to inbox</button></div>`;ul.appendChild(f);
   const inp=f.querySelector("input");const save=async()=>{const text=inp.value.trim();if(!text)return;mode=null;const r=await post("/inbox",{op:"add",text});if(r.ok)toast("Added to inbox.md");load()};
   f.querySelector("#ns").onclick=save;f.querySelector("#nc").onclick=()=>{mode=null;render()};inp.onkeydown=e=>{if(e.key==="Enter")save();if(e.key==="Escape"){mode=null;render()}};setTimeout(()=>inp.focus())}
  const shown=unfolded.has(ci)||list.length<=FOLD+1?list:list.slice(0,FOLD);
  shown.forEach(c=>{if(modeKey===key(c)&&mode){ul.appendChild(inlineForm(c));return}const li=document.createElement("li");li.appendChild(card(c));ul.appendChild(li)});
  if(shown.length<list.length){const li=document.createElement("li");li.innerHTML=`<button class="more-btn">Show ${list.length-shown.length} more</button>`;li.firstChild.onclick=()=>{unfolded.add(ci);render()};ul.appendChild(li)}
  else if(unfolded.has(ci)&&list.length>FOLD+1){const li=document.createElement("li");li.innerHTML=`<button class="more-btn">Show less</button>`;li.firstChild.onclick=()=>{unfolded.delete(ci);render()};ul.appendChild(li)}
  s.appendChild(ul);b.appendChild(s)});
 const seen=new Map();cs.forEach(c=>seen.set(c.status,1));
 $("legend").innerHTML=[...seen.keys()].map(s=>`<span class="st d-${ICON[s]}" style="display:inline-grid;vertical-align:-2px"><svg><use href="#s-${ICON[s]}"/></svg></span> ${WORD[s]||s}`).join("   ");}

// ---- detail panel
function open(c){
 openKey=key(c);$("panel").classList.add("open");$("scrim").classList.add("on");$("ptitle").textContent=c.text;render();
 if(c.kind==="idea"){runDoc=null;$("psub").textContent="idea · inbox.md · "+c.where;$("ptabs").innerHTML="";$("pbody").innerHTML=`<p>${esc(c.text)}</p><p style="color:var(--dim)">Run turns this into a plan you approve before any work starts.</p>`;
  const foot=$("pfoot");foot.innerHTML=c.status==="idea"?`<button class="btn pri" data-a="run">Run</button><button class="btn" data-a="edit">Edit</button><button class="btn" data-a="reject">Reject</button><button class="btn ghost danger" data-a="delete">Delete</button>`:`<span style="color:var(--dim);font-size:12px">Starting: a run was launched for this idea.</span>`;
  foot.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{close();mode=b.dataset.a;modeKey=openKey;render()});return}
 openRun(c,false)}
async function openRun(c,refresh){
 if(!refresh||!runDoc||runDoc.id!==c.id){runDoc=await fetch(`/run/${encodeURIComponent(c.id)}?dir=${encodeURIComponent(c.state)}`).then(r=>r.json())}
 if(openKey!==key(c))return;
 $("psub").textContent=c.id+" · "+(WORD[c.status]||c.status)+(c.awaiting?" · "+c.awaiting:"");
 const tabs=[["Request","request"],["Plan","plan"],["Impl","impl"],["Review","review"],["Backlog","backlog"]];
 $("ptabs").innerHTML=tabs.map((t,i)=>`<button class="${i===tab?"on":""}" data-i="${i}">${t[0]}</button>`).join("");
 [...$("ptabs").children].forEach(b=>b.onclick=()=>{tab=+b.dataset.i;openRun(c,true)});
 const k=tabs[tab][1],doc=runDoc[k];
 $("pbody").innerHTML=doc?md(doc):`<p style="color:var(--dim)">No ${({request:"00-request.md",plan:"01-plan.md",impl:"03-impl.md",review:"04-review.md",backlog:"06-backlog.md"})[k]} yet.</p>`;
 const foot=$("pfoot");
 if(c.status==="waiting")foot.innerHTML=`<span style="color:var(--dim);font-size:12px;flex:1">Waiting on <b>${esc(c.awaiting)}</b>. Answer in the terminal running this run.</span><button class="btn ghost" data-a="ab">Abandon</button>`;
 else if(c.status==="done"||c.status==="abandoned")foot.innerHTML="";
 else foot.innerHTML=`<button class="btn ghost" data-a="ab">Abandon run</button>`;
 foot.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{close();mode="reject";modeKey=key(c);render()})}
function close(){openKey=null;runDoc=null;$("panel").classList.remove("open");$("scrim").classList.remove("on");render()}
$("pclose").onclick=close;$("scrim").onclick=close;

// Enough markdown for kaizen's own files: headings, lists, fences, tables,
// inline code, bold. Everything is escaped first.
function md(src){
 const lines=src.split("\n"),out=[];let i=0,list=null;
 const inl=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
 const endList=()=>{if(list){out.push(`</${list}>`);list=null}};
 while(i<lines.length){const l=lines[i];
  if(/^```/.test(l)){endList();const buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i]))buf.push(lines[i++]);out.push(`<pre>${esc(buf.join("\n"))}</pre>`);i++;continue}
  const hm=/^(#{1,6})\s+(.*)$/.exec(l);if(hm){endList();out.push(`<h${Math.min(hm[1].length,3)}>${inl(hm[2])}</h${Math.min(hm[1].length,3)}>`);i++;continue}
  if(/^---+$/.test(l.trim())){endList();out.push("<hr>");i++;continue}
  if(/^\|/.test(l)){endList();const rows=[];while(i<lines.length&&/^\|/.test(lines[i]))rows.push(lines[i++]);const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>inl(c.trim()));out.push("<table>"+rows.filter(r=>!/^\|\s*-/.test(r)).map((r,n)=>`<tr>${cells(r).map(c=>n?`<td>${c}</td>`:`<th>${c}</th>`).join("")}</tr>`).join("")+"</table>");continue}
  const li=/^\s*(?:[-*]|\d+\.)\s+(.*)$/.exec(l);if(li){const t=/^\s*\d+\./.test(l)?"ol":"ul";if(list!==t){endList();out.push(`<${t}>`);list=t}out.push(`<li>${inl(li[1])}</li>`);i++;continue}
  if(!l.trim()){endList();i++;continue}
  endList();const buf=[l];i++;while(i<lines.length&&lines[i].trim()&&!/^(#|```|\||\s*[-*]\s|\s*\d+\.\s|---)/.test(lines[i]))buf.push(lines[i++]);out.push(`<p>${inl(buf.join(" "))}</p>`)}
 endList();return out.join("")}

// ---- settings, toast, notifications, keys
function openSettings(){
 openKey=null;runDoc=null;$("panel").classList.add("open");$("scrim").classList.add("on");$("ptitle").textContent="Settings";$("psub").textContent="theme is this browser's; everything else is kaizen settings in a terminal";$("ptabs").innerHTML="";$("pfoot").innerHTML="";
 const cur=document.documentElement.dataset.theme||"system";
 $("pbody").innerHTML=`<div class="set"><label>Theme</label><div class="opts" id="th">${["system","light","dark"].map(t=>`<button class="${t===cur?"on":""}" data-t="${t}">${t}</button>`).join("")}</div>
  <label>Notifications</label><div class="opts" id="nt"><button>${typeof Notification==="undefined"?"unsupported":Notification.permission==="granted"?"on":"ask"}</button></div></div>
  <p style="color:var(--dim);margin-top:20px;max-width:52ch">Agent, runner, approvals and the rest live in <code>config.yml</code>. Run <code>kaizen settings</code> to change them.</p>`;
 $("th").querySelectorAll("button").forEach(b=>b.onclick=()=>{const t=b.dataset.t;if(t==="system")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;try{t==="system"?localStorage.removeItem("kz-theme"):localStorage.setItem("kz-theme",t)}catch(e){}openSettings()});
 $("nt").querySelector("button").onclick=()=>{askNotify();setTimeout(openSettings,300)}}
let tt;function toast(s){const t=$("toast");t.textContent=s;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),4000)}
function askNotify(){try{if(typeof Notification!=="undefined"&&Notification.permission==="default")Notification.requestPermission()}catch(e){}}
function notifyUser(title,body){try{if(typeof Notification!=="undefined"&&Notification.permission==="granted")new Notification(title,{body})}catch(e){}}
$("proj").onchange=e=>{all=e.target.value==="all";load()};
$("newtop").onclick=()=>{mode="new";render();$("board").scrollTo(0,0)};
$("settings").onclick=openSettings;
try{const t=localStorage.getItem("kz-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("kbd").onclick=()=>$("help").classList.add("on");$("help").onclick=()=>$("help").classList.remove("on");
document.addEventListener("click",()=>{if(menuKey){menuKey=null;render()}});
document.onkeydown=e=>{
 if(e.target.matches("input,select"))return;
 if(e.key==="?"){$("help").classList.toggle("on");return}
 if(e.key==="Escape"){$("help").classList.remove("on");if(mode){mode=null;render()}else close();return}
 if(e.key==="n"){mode="new";render()}
 if(e.key==="a"){all=!all;load()}
 const oc=openKey&&S.cards.find(c=>key(c)===openKey);if(!oc)return;
 if(e.key==="e"&&oc.kind==="idea"){close();mode="edit";modeKey=key(oc);render()}
 if(e.key==="x"&&!["done","abandoned","starting"].includes(oc.status)){close();mode="reject";modeKey=key(oc);render()}
 if(e.key==="r"&&oc.kind==="idea"){close();mode="run";modeKey=key(oc);render()}};

// ---- live
function listen(){const es=new EventSource("/events");es.onmessage=ev=>{if(ev.data==="changed")load()};es.onerror=()=>{es.close();setTimeout(listen,3000)}}
load();listen();
</script>
