/* ---- the Video page ---- */
.hdr h1{margin:0;font-size:15px;font-weight:600}
@media(max-width:640px){.hdr{padding:28px 16px 12px}.hdr h1{flex:1;font-size:20px}}

.sp{flex:1}
/* Buttons as on the board and in Notes (board.html .btn/.ib): one look across every page. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border:1px solid var(--line);border-radius:var(--r-s);padding:4px 12px;color:var(--ink);background:var(--bg-2);min-height:30px;font-size:13px;font-weight:500;box-shadow:var(--shadow-1);transition:background .12s,border-color .12s,color .12s}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.pri:hover{background:color-mix(in srgb,var(--accent) 88%,var(--ink))}
.btn.ghost{background:none;border-color:transparent;color:var(--dim);box-shadow:none}.btn.ghost:hover{color:var(--ink);background:var(--hover)}
.btn:disabled{opacity:.5;cursor:default}
.ib{width:34px;height:34px;display:grid;place-items:center;color:var(--dim);border-radius:var(--r-s);transition:background .12s,color .12s}
.ib:hover{color:var(--ink);background:var(--hover)}
.page{flex:1;min-height:0;overflow:auto;padding-block:20px 40px;padding-left:max(16px,2.4vw);padding-right:max(16px,2.4vw)}
.note{color:var(--dim);font-size:12px;margin:8px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;width:max-content;max-width:100%;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--r-pill);background:var(--hover);color:var(--dim)}
.pill::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ready{color:var(--ok)}.pill.rendering,.pill.building,.pill.queued{color:var(--run)}.pill.draft{color:var(--warn)}.pill.failed{color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:32px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line);color:var(--dim)}
.chip:hover{color:var(--ink)}
.chip.on{border-color:var(--accent);color:var(--ink);background:color-mix(in srgb,var(--accent) 12%,transparent)}
/* library: CSS columns, each tile at its video's real shape */
.find{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.find input{flex:1;min-width:200px;height:36px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg-2);padding:0 12px}
.grid{columns:200px;column-gap:16px}
.vid{width:100%;break-inside:avoid;margin-bottom:16px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column;cursor:pointer}
.vid:hover{box-shadow:var(--shadow-2)}
.thumb{position:relative;aspect-ratio:var(--ar);max-width:100%;display:grid;place-items:center;padding:14px;text-align:center;color:#fff;font-weight:700;font-size:14px;background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 30%,#000)) center/cover;overflow:hidden}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb span.t{position:relative;text-shadow:0 1px 8px rgb(0 0 0/.6);text-wrap:balance}
.tag{position:absolute;z-index:1;font:600 10px/1 var(--mono);background:rgb(0 0 0/.6);color:#fff;padding:4px 6px;border-radius:4px}
.tag.sh{top:8px;left:8px}.tag.du{bottom:10px;right:8px}
.bar{position:absolute;z-index:1;left:0;bottom:0;height:4px;background:var(--run)}
.vid .meta{padding:10px 12px;display:grid;gap:5px;min-width:0}
.vid .meta b{overflow-wrap:anywhere}
.plats{display:flex;flex-wrap:wrap;gap:4px}
.plats i{font-style:normal;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--hover);color:var(--dim)}
.plats i.where{background:none;border:1px solid var(--line)}
.blank{padding:60px 20px;text-align:center;color:var(--dim);display:grid;gap:8px;justify-items:center}
.blank b{color:var(--ink);font-size:15px}
/* editor */
.crumb{color:var(--dim);font-size:13px}
.crumb button{color:var(--accent)}
.ehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.ehead h2{margin:0;font-size:20px;flex:1;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.ed{display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr);gap:20px;align-items:start}
.player{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;position:sticky;top:0}
.screen{position:relative;width:100%;aspect-ratio:var(--ar);max-width:100%;border-radius:var(--r-s);overflow:hidden;background:#000}
.screen iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none}
.screen .none{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:#cfd6e6;font-size:12px}
.ctrl{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}
.ctrl .play{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.ctrl .play svg{width:14px;height:14px;fill:currentColor;stroke:none}
.strip{position:relative;display:flex;height:26px;border-radius:6px;overflow:hidden;gap:2px}
.strip button{min-width:4px;font:700 10px/1 var(--mono);color:#fff;background:var(--c)}
.strip button.on{outline:2px solid var(--ink);outline-offset:-2px}
.head{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);pointer-events:none}
.stills{display:flex;gap:6px;overflow-x:auto}
.stills img{height:90px;border-radius:4px;border:1px solid var(--line)}
.beats{display:grid;gap:8px;min-width:0}
.beat{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);min-width:0}
.beat.open{border-color:var(--accent)}
.beat>button{width:100%;display:grid;grid-template-columns:12px 64px 92px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;text-align:left}
.beat>button .sw{width:12px;height:12px;border-radius:3px;background:var(--c)}
.beat>button .k{font-weight:600;text-transform:capitalize}
.beat>button .tm{font:11px var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
.beat>button .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
.beat .form{display:none;padding:0 12px 14px 34px;gap:10px}
.beat.open .form{display:grid}
.form label{display:grid;gap:4px;color:var(--dim);font-size:12px}
.form input,.form textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);color:var(--ink);padding:8px 10px}
.form textarea{min-height:56px;resize:vertical}
.form .said{font-size:12px;color:var(--dim);border-left:2px solid var(--line);padding-left:10px}
.savebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px}
.savebar .chips{flex:1}
.job{display:grid;gap:6px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px}
.job .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.job .prog{height:4px;border-radius:2px;background:var(--hover);overflow:hidden}
.job .prog i{display:block;height:100%;background:var(--run)}
.job pre{margin:0;max-height:160px;overflow:auto;font:11px/1.4 var(--mono);color:var(--dim);white-space:pre-wrap;overflow-wrap:anywhere}
.files{display:grid;gap:8px}
.file{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;background:var(--bg-2)}
.file b{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;flex:1;min-width:0}
.file a{color:var(--accent)}
.file.ver{cursor:pointer}
.btn.danger{color:var(--danger)}.btn.danger:hover{border-color:var(--danger)}
.vname{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;flex:1;min-width:0}.vname:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.file.ver:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.file.ver.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.file.ver:focus-visible{outline:2px solid var(--accent)}
.vfacts{font-size:12px;color:var(--dim)}.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vgroup{display:flex;flex-direction:column;gap:6px}.file.sub{margin-left:18px}
.pill.ver-l{font-family:var(--mono);text-transform:none;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink-hi)}
.hist summary{cursor:pointer;font-size:12px;color:var(--dim);padding:4px 0 4px 18px}.hist[open]{display:flex;flex-direction:column;gap:6px}
@media(max-width:640px){
 .file.ver{flex-direction:column;align-items:stretch;gap:6px}.file.sub{margin-left:10px}
 .file b{overflow-wrap:break-word;word-break:normal}.vname{flex-wrap:wrap}
 .acts .btn,.acts a{min-height:44px;display:inline-flex;align-items:center;justify-content:center}.acts .btn{flex:1 1 auto}.acts a{padding:0 6px}
 .hist summary{min-height:44px;display:flex;align-items:center;padding-left:10px}
}
.screen video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.player.file #play,.player.file #time,.player.file .strip{display:none}
/* send: the mockup's send panel, one tab per way */
.sendp{margin-top:16px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;max-width:880px}
.sendp .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sendp h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.sendp select,.sendp textarea{border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);color:var(--ink);padding:8px 10px;max-width:100%;min-width:0}
.sendp textarea{width:100%;min-height:64px;resize:vertical;font:inherit}
.sendp label{display:grid;gap:4px;color:var(--dim);font-size:12px}
.sendp .chip small{color:var(--dim);font-weight:400}
.sendbox{border:1px solid var(--line);border-radius:var(--r-s);padding:12px;display:grid;gap:10px;align-content:start;background:var(--bg)}
.sendres.sent{border-color:var(--ok)}.sendres.failed{border-color:var(--danger)}
.sends{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:12px}
.sends li{overflow-wrap:anywhere}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r-s);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
/* new video: one form, the mockup's */
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:22px;max-width:880px}
.card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
.card h3 small{text-transform:none;letter-spacing:0;font-weight:400}
.src{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:1px solid var(--line);border-radius:var(--r-s);padding:14px;text-align:left;display:grid;gap:4px}
.opt small{color:var(--dim)}
.opt.on,.sty.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card textarea,.card input[type=text],.card select{width:100%;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);color:var(--ink);padding:10px}
.card textarea{min-height:96px;resize:vertical}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sty{border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;text-align:left;display:grid;gap:2px}
.sty small{color:var(--dim);font-size:11px}
.lenrow{display:flex;gap:12px;align-items:center}
.lenrow input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px}
.lenrow input[type=text]{width:84px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.ticks{position:relative;height:16px;margin-right:96px;color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%)}.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.warn-t{color:var(--warn)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two label{display:grid;gap:6px;color:var(--dim);font-size:12px}
.pickrow{display:flex;gap:8px}
.foot{display:flex;justify-content:flex-end;gap:8px}
/* the agent working on this video: its board terminal, here */
#dock:empty{display:none}
#dock{display:grid;gap:8px}
.rcol{min-width:0;display:grid;gap:12px;align-content:start}
.tabs{display:flex;gap:4px;padding:4px;background:var(--canvas);border:1px solid var(--line);border-radius:var(--r-s);width:max-content}
.tabs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 16px;border-radius:6px;font-size:14px;font-weight:600;color:var(--dim)}
.tabs button[aria-selected=true]{background:var(--bg-2);color:var(--ink);box-shadow:var(--shadow-1)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.tdot{display:none;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.tabs .ask .tdot{display:inline-block}
.termpane:has(#dock:not(:empty)) .tnone{display:none}
.termpane .term{height:min(640px,calc(100vh - 260px))}
.agentbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--run) 10%,var(--bg-2));border:1px solid color-mix(in srgb,var(--run) 45%,var(--line));border-radius:var(--r-s);padding:10px 12px}
.agentbar.asking{background:color-mix(in srgb,var(--warn) 12%,var(--bg-2));border-color:var(--warn)}
.agentbar b{flex:1;min-width:0}
.term{height:min(440px,60vh);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--bg)}
.term .xterm{height:100%;padding:6px}
.ask{display:flex;gap:8px;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px}
.ask input{flex:1;min-width:0;border:0;background:none;color:var(--ink);padding:6px}
.thumb.making{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--run) 30%,#000) 0 14px,color-mix(in srgb,var(--run) 18%,#000) 14px 28px)}
@media(max-width:640px){.ticks .m-hide{display:none}.src,.two{grid-template-columns:1fr}.styles{grid-template-columns:1fr 1fr}.foot .btn{flex:1;height:44px}.term{height:60vh}}
@media(max-width:900px){.ed{grid-template-columns:minmax(0,1fr)}.player{position:static;max-width:360px;width:100%;justify-self:center}}
@media(max-width:640px){.grid{columns:2;column-gap:10px}.vid{margin-bottom:10px}.thumb{font-size:12px;padding:10px}.vid .meta{padding:8px}
  .beat>button{grid-template-columns:12px minmax(0,1fr) 84px}.beat>button .tx{display:none}.beat .form{padding-left:12px}
  .acts{width:100%}.acts .btn{flex:1;height:40px}.chip{min-height:40px}}
</style>
</head>

<script>
// Side menu: theme and collapse, the same lines in board.html and notes.html. Runs before
// the page draws, so a stored theme or a collapsed menu never flashes the default first.
(()=>{const r=document.documentElement,wide=matchMedia("(max-width:1100px)"),phone=matchMedia("(max-width:640px)"),os=matchMedia("(prefers-color-scheme: dark)");
 // The toggle's choice is kept per browser; with none, the width decides. A phone always gets icons.
 let fold=null;try{fold=localStorage.getItem("kz-rail")}catch(e){}
 const rail=()=>{const m=phone.matches||(fold?fold==="min":wide.matches),b=document.getElementById("fold");r.dataset.rail=m?"min":"full";r.dataset.hide=!phone.matches&&fold==="min"?"1":"0";b.title=m?"Expand menu":"Collapse menu";b.setAttribute("aria-label",b.title);b.setAttribute("aria-expanded",!m)};
 wide.addEventListener("change",rail);phone.addEventListener("change",rail);rail();
 document.getElementById("fold").onclick=()=>{fold=r.dataset.rail==="min"?"full":"min";try{localStorage.setItem("kz-rail",fold)}catch(e){}rail()};
 // Theme: light, dark, or unset for system, in kz-theme. The toggle shows what is on screen and flips it.
 const paint=()=>{const d=r.dataset.theme?r.dataset.theme==="dark":os.matches;const b=document.getElementById("themet");if(b){b.dataset.dark=d;b.title=d?"Dark theme: switch to light":"Light theme: switch to dark";b.setAttribute("aria-label",b.title)}};
 // Colour: unset for monochrome, or blue, in kz-color. kz-theme repaints the terminals and Settings.
 window.setColor=c=>{if(c==="blue")r.dataset.color=c;else delete r.dataset.color;try{c==="blue"?localStorage.setItem("kz-color",c):localStorage.removeItem("kz-color")}catch(e){}dispatchEvent(new Event("kz-theme"))};
 try{if(localStorage.getItem("kz-color")==="blue")r.dataset.color="blue"}catch(e){}
 window.setTheme=t=>{if(t==="system")delete r.dataset.theme;else r.dataset.theme=t;try{t==="system"?localStorage.removeItem("kz-theme"):localStorage.setItem("kz-theme",t)}catch(e){}paint();dispatchEvent(new Event("kz-theme"))};
 try{const t=localStorage.getItem("kz-theme");if(t)r.dataset.theme=t}catch(e){}
 // Motion: full, reduce, or unset to follow the system's reduced-motion, in kz-motion.
 window.setMotion=m=>{if(m==="system")delete r.dataset.motion;else r.dataset.motion=m;try{m==="system"?localStorage.removeItem("kz-motion"):localStorage.setItem("kz-motion",m)}catch(e){}};
 try{const m=localStorage.getItem("kz-motion");if(m)r.dataset.motion=m}catch(e){}
 // Settings changed in another window or tab apply here at once, not on the next reload.
 addEventListener("storage",e=>{const m={"kz-theme":"theme","kz-color":"color","kz-motion":"motion"}[e.key];if(!m)return;if(e.newValue)r.dataset[m]=e.newValue;else delete r.dataset[m];dispatchEvent(new Event("kz-theme"))});
 os.addEventListener("change",paint);paint();
 document.getElementById("themet").onclick=e=>setTheme(e.currentTarget.dataset.dark==="true"?"light":"dark");
 // Setup: while first-run onboarding is skipped or unfinished, a row that continues it; the board redraws it as it saves.
 window.kzSetupRow=o=>{const a=document.getElementById("rsetup");if(!a)return;a.hidden=!(o&&o.resume);if(o&&o.resume){a.querySelector(".ring").style.setProperty("--p",Math.round(o.step/o.total*100)+"%");a.title="Continue setup: step "+(o.step+1)+" of "+o.total}};
 fetch("/onboarding").then(r=>r.ok?r.json():null).then(window.kzSetupRow).catch(()=>{});
 // Phones: More holds the tabs that do not fit; a pick or a tap elsewhere closes it.
 const more=document.querySelector(".mtab");if(more){more.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>more.open=false));addEventListener("pointerdown",e=>{if(more.open&&!more.contains(e.target))more.open=false},true)}})();
</script>
