<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>kaizen game</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/logo.png">
<style>
/* The Game page has its own look, parchment by day and a night variant: tokens only, nothing hard-coded below. */
:root{--bg:#e6d6b2;--panel:#f4ead2;--panel-2:#eadcb8;--line:#7a5a2c;--ink:#2c1d0e;--dim:#5e4729;--gold:#7a5100;--gold-fill:#d9a62e;--ok:#2f6b2d;--danger:#8f2323;--on-gold:#2c1d0e;--shade:rgb(60 40 10/.25);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1020;--panel:#181b33;--panel-2:#232748;--line:#9a7b3c;--ink:#f0e7d0;--dim:#b8ad92;--gold:#e8bd55;--gold-fill:#c9962c;--ok:#74c46f;--danger:#ef7a7a;--on-gold:#1a1204;--shade:rgb(0 0 0/.5);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0d1020;--panel:#181b33;--panel-2:#232748;--line:#9a7b3c;--ink:#f0e7d0;--dim:#b8ad92;--gold:#e8bd55;--gold-fill:#c9962c;--on-gold:#1a1204;--ok:#74c46f;--danger:#ef7a7a;--shade:rgb(0 0 0/.5);color-scheme:dark}
*{box-sizing:border-box}
:root{--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,color-mix(in srgb,var(--panel) 55%,var(--bg)),var(--bg) 70%);color:var(--ink);font:15px/1.5 var(--serif);-webkit-font-smoothing:antialiased}
@media(max-width:640px){body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}}
button,a{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}a{text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 48px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.bar a.back,.bar button{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:600 13px var(--sans);color:var(--ink)}
.bar a.back:hover,.bar button:hover{background:var(--panel-2)}
.bar h1{flex:1;margin:0;font:700 22px/1.2 var(--serif);letter-spacing:.04em;color:var(--gold);text-align:center;text-transform:uppercase}
/* a framed parchment panel: a double rule with a diamond at each corner */
.panel{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:4px;box-shadow:inset 0 0 0 4px var(--panel),inset 0 0 0 5px var(--line),0 6px 18px -8px var(--shade);padding:20px}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;background:var(--gold-fill);border:1px solid var(--line);transform:rotate(45deg);top:-6px;left:-6px}
.panel::after{left:auto;right:-6px}
h2{margin:0 0 12px;font:700 16px var(--serif);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
h3{margin:0;font:700 17px var(--serif)}
.hero{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:center}
.portrait{width:150px;height:190px;border:2px solid var(--line);border-radius:4px;background:linear-gradient(var(--panel-2),var(--panel));display:block}
.portrait.art{object-fit:cover}
.emblem{width:40px;height:40px;object-fit:contain;align-self:center}
.name{font:700 28px/1.1 var(--serif);margin:0}
.lvl{font:600 13px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:2px 0 10px}
.lvl b{font:700 22px var(--serif);color:var(--gold);letter-spacing:0;margin-left:6px}
.xp{height:14px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);overflow:hidden}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-fill),color-mix(in srgb,var(--gold-fill) 70%,#fff));border-radius:7px 0 0 7px}
.xpn{margin:5px 0 0;font:13px var(--sans);color:var(--dim)}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;font:13px var(--sans);color:var(--dim)}
.stats b{font:700 18px var(--serif);color:var(--ink);margin-right:4px}
section{margin-top:22px}
.guilds{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.guild{padding:16px 18px}
.guild.locked{opacity:.78}
.guild header{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.guild header span{margin-left:auto;font:700 13px var(--sans);color:var(--gold);white-space:nowrap}
.blurb{margin:0 0 10px;font-size:14px;color:var(--dim);font-style:italic}
.skills{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px}
.skills li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font:14px var(--sans)}
.skills li .xp{grid-column:1/3;height:6px;border-radius:3px}
.skills li .xp i{border-radius:3px 0 0 3px}
.skills small{color:var(--dim)}
.more{margin:8px 0 0;font:12px var(--sans);color:var(--dim)}
.log{display:grid;gap:0}
.row{display:grid;grid-template-columns:92px 1fr auto;gap:4px 14px;align-items:center;padding:10px 4px;border-top:1px solid color-mix(in srgb,var(--line) 40%,transparent)}
.row:first-child{border-top:0}
.row .t{font:600 15px var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{grid-column:2;font:12px var(--sans);color:var(--dim)}
.row .x{grid-column:3;grid-row:1/3;font:700 15px var(--sans);color:var(--gold);text-align:right;white-space:nowrap}
.badge{font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor;border-radius:999px;text-align:center}
.badge.cleared{color:var(--ok)}.badge.retreat,.badge.stalled{color:var(--danger)}.badge.live{color:var(--gold)}
.badge.live::before{content:"";display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.badge.live::before{animation:none}}
.row[data-open]{cursor:pointer;border-radius:4px}.row[data-open]:hover,.row[data-open]:focus-visible{background:var(--panel-2)}
.dg,.tw{margin-bottom:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.visit{margin-top:14px;min-height:36px;padding:0 14px;border:1px solid var(--gold);border-radius:6px;background:var(--panel-2);font:700 13px var(--sans);color:var(--gold)}.visit:hover{background:var(--panel)}
.toast{margin:0 0 14px;padding:9px 14px;border:1px solid var(--gold);border-radius:6px;background:var(--panel-2);font:14px var(--sans);color:var(--ink)}
.toast button{margin-left:10px;padding:2px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font:600 12px var(--sans);color:var(--ink)}
.tw-stage{position:relative;border:2px solid var(--line);border-radius:4px;overflow:hidden;background:linear-gradient(var(--panel-2),color-mix(in srgb,var(--panel-2) 55%,var(--bg)))}.tw-stage canvas{display:block}
.tw-label{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;padding:1px 7px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--panel) 88%,transparent);font:600 11px var(--sans);color:var(--dim)}.tw-label b{color:var(--ink);margin-right:3px}
.tw-info{margin-top:10px;font:14px var(--sans);color:var(--dim)}.tw-info h3{font-size:16px;color:var(--ink);margin-bottom:4px}.tw-info p{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:inline-block;padding:4px 11px;border:1px solid var(--gold);border-radius:999px;background:var(--panel-2);font:600 13px var(--sans);color:var(--ink);cursor:grab;touch-action:none;user-select:none}
.chip:active{cursor:grabbing}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-130%);box-shadow:0 6px 14px -6px var(--shade)}
.tw-info button.link{padding:0;border:0;background:none;color:var(--gold);font:600 13px var(--sans);text-decoration:underline;cursor:pointer}
.tw-found{margin-top:12px;font:14px var(--sans)}.tw-found summary{cursor:pointer;font-weight:700;color:var(--gold)}
.tw-found form{display:grid;gap:10px;margin-top:10px;max-width:460px}.tw-found label{display:grid;gap:3px;font-size:13px;color:var(--dim)}
.tw-found input{min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:15px var(--sans);color:var(--ink)}
.tw-found button{justify-self:start;min-height:36px;padding:0 16px;border:1px solid var(--gold);border-radius:6px;background:var(--panel-2);font:700 13px var(--sans);color:var(--gold)}
.mv{grid-column:1/3;display:block}.mv select{max-width:100%;min-height:28px;padding:0 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font:12px var(--sans);color:var(--dim)}
.tw-list{margin:8px 0 0;padding-left:20px;font:14px var(--sans);color:var(--dim)}
.cr{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}@media(max-width:720px){.cr{grid-template-columns:1fr}}
.cr-stage{position:relative;border:2px solid var(--line);border-radius:4px;overflow:hidden;background:linear-gradient(var(--panel-2),color-mix(in srgb,var(--panel-2) 55%,var(--bg)))}.cr-stage canvas{display:block}
.cr-missing{position:absolute;inset:auto 10px 10px;margin:0;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:color-mix(in srgb,var(--panel) 90%,transparent);font:13px var(--sans);color:var(--dim)}
.cr-form{display:grid;gap:10px;font:14px var(--sans);color:var(--dim)}.cr-form label{display:grid;gap:3px;font-size:13px}
.cr-form select{min-height:36px;padding:0 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:15px var(--sans);color:var(--ink)}
.cr-form input[type=range]{width:100%;min-height:28px;accent-color:var(--gold)}.cr-form input[type=color]{width:100%;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.cr-presets{display:flex;flex-wrap:wrap;gap:6px}.cr-presets button,.cr-actions button{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:600 13px var(--sans);color:var(--ink)}
.cr-presets button:hover,.cr-actions button:hover{background:var(--panel-2)}.cr-colors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.cr-actions{display:flex;gap:8px}.cr-save{border-color:var(--gold)!important;color:var(--gold)!important;font-weight:700!important}.cr-save:disabled{opacity:.5}.cr-status{margin:0;min-height:1.4em}
.dg-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.dg-bar h2{flex:1;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dg-bar button{min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:600 13px var(--sans);color:var(--ink)}.dg-bar button:hover{background:var(--panel-2)}
.dg-hud{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.dg-chip{font:600 12px var(--sans);padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim);background:var(--panel)}.dg-chip b{color:var(--ink)}
.dg-chip.now{border-color:var(--gold);color:var(--gold);background:var(--panel-2)}.dg-chip.done{color:var(--ok);border-color:var(--ok)}
.dg-stage{border:2px solid var(--line);border-radius:4px;overflow:hidden;background:linear-gradient(var(--panel-2),color-mix(in srgb,var(--panel-2) 55%,var(--bg)))}.dg-stage canvas{display:block}
.dg-loot{margin-top:8px;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);font:13px var(--sans);color:var(--ink)}.dg-loot b{color:var(--gold)}
.dg-text{margin:8px 0 0;padding-left:20px;font:13px var(--sans);color:var(--dim)}
.empty{color:var(--dim);font-style:italic;margin:0}
@media(max-width:640px){
 .hero{grid-template-columns:96px 1fr;gap:14px}.portrait{width:96px;height:122px}.name{font-size:22px}
 .bar h1{font-size:16px}.bar .lbl{display:none}
 .row{grid-template-columns:78px 1fr}.row .x{grid-column:2;grid-row:auto;text-align:left}
 .guilds{grid-template-columns:1fr}.panel{padding:16px 14px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <a class="back" href="/" title="Back to the board">← <span class="lbl">Board</span></a>
    <h1>Kaizen Realm</h1>
    <button id="theme" title="Switch between day and night" aria-label="Switch between day and night">☾</button>
  </div>
  <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>
  <p id="scenes" class="toast" role="status" aria-live="polite" hidden></p>
  <section id="creator" class="panel" hidden aria-label="Hero creator">
    <div class="dg-bar"><h2>Make your hero</h2><button id="cr-close" type="button" aria-label="Close the creator">✕</button></div>
    <div id="cr-body"></div>
  </section>
  <section id="town" class="panel tw" hidden aria-label="Guild town">
    <div class="dg-bar"><h2>The guild town</h2><button id="tw-close" type="button" aria-label="Close the town">✕</button></div>
    <div id="tw-body"></div>
    <div id="tw-info" class="tw-info"></div>
    <details class="tw-found"><summary>Found a guild</summary>
      <form id="found" autocomplete="off">
        <label>Name<input name="name" maxlength="40" required></label>
        <label>Starting skills, separated by commas (up to 8)<input name="skills"></label>
        <button type="submit">Found it</button>
      </form>
    </details>
  </section>
  <section id="dungeon" class="panel dg" hidden aria-label="Dungeon">
    <div class="dg-bar"><h2 id="dg-title"></h2>
      <button id="dg-pause" type="button">Pause</button><button id="dg-replay" type="button">Replay</button><button id="dg-close" type="button" aria-label="Close the dungeon">✕</button></div>
    <div id="dg-body"></div>
  </section>
  <main id="root" aria-busy="true"><p class="empty">Gathering the tales of your runs…</p></main>
</div>
<script src="/game.js"></script>
</body>
</html>
