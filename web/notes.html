<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kaizen notebook</title>
<style>
/* Tokens: copied from web/board.html, line for line; cli/notes.test.ts holds them equal. */
:root{--bg:#f6f8fc;--bg-2:#fff;--line:#d9e0ee;--ink:#0c162f;--ink-hi:#0c162f;--dim:#5b6b8c;--accent:#2d50a5;--run:#0f8fa3;--ok:#1f9d55;--warn:#a8720a;--danger:#c8322f;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c162f;--bg-2:#121e3c;--line:#22305a;--ink:#eef2fa;--ink-hi:#deeeff;--dim:#96aacd;--accent:#486ed9;--run:#4fd6e6;--ok:#5fd28a;--warn:#e6b450;--danger:#e85050;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0c162f;--bg-2:#121e3c;--line:#22305a;--ink:#eef2fa;--ink-hi:#deeeff;--dim:#96aacd;--accent:#486ed9;--run:#4fd6e6;--ok:#5fd28a;--warn:#e6b450;--danger:#e85050;color-scheme:dark}
*{box-sizing:border-box}
/* Shape, type and depth. --shade is the one shadow colour, themed like the rest. */
:root{--r:10px;--r-s:6px;--r-pill:999px;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;--mono:ui-monospace,"JetBrains Mono","Cascadia Code","SF Mono",Menlo,Consolas,monospace;--on-accent:#fff;--hover:color-mix(in srgb,var(--dim) 12%,transparent);--shade:rgb(12 22 47/.1);--shadow-1:0 1px 2px var(--shade);--shadow-2:0 2px 6px var(--shade),0 16px 40px -12px var(--shade)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--shade:rgb(0 0 0/.45)}}
:root[data-theme=dark]{--shade:rgb(0 0 0/.45)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit;background:none;border:0;padding:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
[hidden]{display:none!important}

/* header: the board's, with the wordmark as the way back */
.hdr{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--bg-2);flex-wrap:wrap}
pre.mark{margin:0;font:700 8px/1 var(--mono)}
pre.mark span:nth-child(1){color:var(--ink-hi)}pre.mark span:nth-child(2){color:color-mix(in srgb,var(--ink-hi),var(--accent))}pre.mark span:nth-child(3){color:var(--accent)}
.hdr h1{margin:0;font-size:13px;font-weight:600;color:var(--dim)}
.sel{border:1px solid var(--line);border-radius:var(--r-s);padding:6px 12px;background-color:var(--bg-2);color:var(--ink);font-size:13px}
select.sel{cursor:pointer;appearance:none;padding-right:30px;max-width:min(320px,100%);text-overflow:ellipsis;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.sel:hover{border-color:var(--dim)}
.sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.sel::placeholder{color:var(--dim)}
.sp{flex:1}
.ib{width:34px;height:34px;display:grid;place-items:center;color:var(--dim);border-radius:var(--r-s);transition:background .12s,color .12s}
.ib:hover{color:var(--ink);background:var(--hover)}
.btn{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-s);padding:6px 14px;color:var(--ink);background:var(--bg-2);min-height:32px;font-size:13px;font-weight:500;box-shadow:var(--shadow-1);transition:background .12s,border-color .12s,color .12s}
.btn:hover{border-color:var(--dim)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.pri:hover{box-shadow:var(--shadow-2)}
.btn.danger{color:var(--danger)}.btn.danger:hover{border-color:var(--danger)}
.btn.ghost{background:none;border-color:transparent;color:var(--dim);box-shadow:none}.btn.ghost:hover{color:var(--ink);background:var(--hover)}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:2px 9px;border-radius:var(--r);font-size:11px;font-weight:500;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.chip span{color:var(--dim);font-variant-numeric:tabular-nums}
.chip:hover,.chip.on{background:color-mix(in srgb,var(--accent) 24%,transparent)}.chip.on{box-shadow:inset 0 0 0 1px var(--accent)}
.toast{position:fixed;z-index:12;left:28px;bottom:28px;max-width:calc(100% - 56px);background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 16px;font-size:13px;box-shadow:var(--shadow-2);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* sidebar: search, tags, the folder tree */
.wrap{flex:1;min-height:0;display:grid;grid-template-columns:260px 1fr}
.side{background:var(--bg);border-right:1px solid var(--line);overflow:auto;padding:16px 12px 32px;display:flex;flex-direction:column;gap:10px}
.side input.sel{width:100%}
.side h3,.links h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:10px 8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.tree ul,.links ul{list-style:none;margin:0;padding:0}
.tree ul ul{padding-left:14px}
.tree summary{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:var(--r-s);font-size:13px;font-weight:500;color:var(--dim);cursor:pointer;list-style:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover{background:var(--hover);color:var(--ink)}
.tree summary svg{width:15px;height:15px;flex:none}
.tree .chev{display:block;transition:transform .12s}.tree .chev svg{width:12px;height:12px}
.tree details[open]>summary .chev{transform:rotate(90deg)}
.nt{display:flex;align-items:baseline;gap:8px;width:100%;padding:5px 8px 5px 10px;border-radius:var(--r-s);font-size:13px;text-align:left;color:var(--ink);transition:background .12s}
.nt:hover{background:var(--hover)}
.nt.cur{background:var(--bg-2);box-shadow:inset 2px 0 0 var(--accent),var(--shadow-1);font-weight:500}
.nt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nt .fd,.nt .age{font-size:12px;color:var(--dim);white-space:nowrap}.nt .age{font-variant-numeric:tabular-nums}
.none{margin:4px 10px;font-size:13px;color:var(--dim)}

/* the note: one reading column on paper */
.main{overflow:auto;background:var(--bg-2)}
.page{max-width:68ch;margin:0 auto;padding:40px 28px 30vh}
.wide .page{max-width:none;padding-inline:56px}
/* Dealing a page: the old one is a copy beneath, the new one slides over it. */
.sheet{position:fixed;z-index:5;margin:0;overflow:hidden;pointer-events:none}
.sheet .shade{position:absolute;inset:0;opacity:0;background:color-mix(in srgb,var(--shade) 60%,transparent)}
.side{position:relative;z-index:7}
.main.dealt{position:relative;z-index:6;box-shadow:var(--shadow-2);will-change:transform}
.wrap{overflow:hidden}
/* Full screen: the open note alone, header and sidebar gone. */
.full .hdr,.full .side,.full #side{display:none!important}
.full .wrap{grid-template-columns:1fr}
#title{width:100%;margin:0 0 4px -6px;padding:2px 6px;border:1px solid transparent;border-radius:var(--r-s);font-size:26px;font-weight:600;line-height:1.3;color:var(--ink)}
#title:hover{border-color:var(--line)}
#title:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
#meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:34px;margin:0 0 20px;padding-bottom:8px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
#meta code{font:12px var(--mono)}
#meta .warnw{color:var(--ink);font-weight:500}
#meta .acts{display:flex;gap:8px;margin-left:auto}
#meta .ib{width:30px;height:30px}#meta .ib svg{width:16px;height:16px}
.links{margin-top:56px;padding-top:12px;border-top:1px solid var(--line)}.links h3{margin:0 0 6px 10px}
.blank{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:60vh;text-align:center;padding:0 16px}

.blank b{font-size:16px;font-weight:600}.blank p{margin:0 0 8px;color:var(--dim);max-width:44ch}

/* the editor: CodeMirror, typeset by the live preview in web/notebook.ts */
#editor .cm-editor{font:16px/1.7 var(--font);color:var(--ink);background:none}
#editor .cm-editor.cm-focused{outline:none}
#editor .cm-scroller{font:inherit;line-height:inherit;overflow:visible}
#editor .cm-content{padding:0 0 4px;caret-color:var(--accent);min-height:40vh}
#editor .cm-line{padding:0}
#editor .cm-cursor{border-left:2px solid var(--accent)!important}
#editor .cm-selectionLayer .cm-selectionBackground{background:color-mix(in srgb,var(--accent) 26%,transparent)!important}
#editor .cm-content ::selection{background:color-mix(in srgb,var(--accent) 26%,transparent)}
#editor .cm-h{font-weight:600;line-height:1.35;color:var(--ink)}
#editor .cm-h1{font-size:26px;padding-top:.5em}#editor .cm-h2{font-size:20px;padding-top:.5em}#editor .cm-h3{font-size:16px;padding-top:.3em}
#editor .cm-h4{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);padding-top:.3em}
#editor .cm-quote{border-left:3px solid var(--line);padding-left:14px;color:var(--dim)}
#editor .cm-fence{font:13px/1.6 var(--mono);background:var(--bg);padding:0 12px;border-inline:1px solid var(--line)}
#editor .cm-fence-a{border-top:1px solid var(--line);border-radius:var(--r-s) var(--r-s) 0 0;padding-top:6px;color:var(--dim)}
#editor .cm-fence-z{border-bottom:1px solid var(--line);border-radius:0 0 var(--r-s) var(--r-s);padding-bottom:6px;color:var(--dim)}
#editor .cm-line.cm-fence>span{padding:0;background:none}
#editor .cm-link{color:var(--accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);text-underline-offset:3px}
#editor .cm-link[data-href],#editor [data-note],#editor [data-tag]{cursor:pointer}
#editor .cm-link-src{color:var(--dim)}
#editor .cm-wiki{color:var(--accent)}
#editor .cm-wiki-missing{color:var(--dim);text-decoration:underline dashed;text-underline-offset:3px}
#editor .cm-tag{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:var(--r);padding:1px 7px;font-size:.82em;font-weight:500}
#editor .cm-task{width:15px;height:15px;margin:0 8px 0 2px;vertical-align:-2px;accent-color:var(--accent);cursor:pointer}
#editor .cm-bullet{color:var(--dim);padding:0 6px 0 2px}
#editor .cm-rule{display:inline-block;width:100%;height:0;border-top:1px solid var(--line);vertical-align:middle}
#editor .cm-img{display:block;max-width:100%;margin:6px 0;border-radius:var(--r-s)}

#editor .cm-table{margin:6px 0 10px;overflow-x:auto;cursor:text}
#editor .cm-table table{border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:var(--r-s);font-size:15px;line-height:1.5;min-width:40%}
#editor .cm-table th,#editor .cm-table td{padding:7px 14px;text-align:left;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
#editor .cm-table th:last-child,#editor .cm-table td:last-child{border-right:0}
#editor .cm-table tbody tr:last-child td{border-bottom:0}
#editor .cm-table th{font-weight:600;background:var(--bg)}
#editor .cm-table th:first-child{border-top-left-radius:var(--r-s)}#editor .cm-table th:last-child{border-top-right-radius:var(--r-s)}
/* A link to the board: the section 6 chip with the card's status icon (section 5). */
#editor .cm-board{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:var(--r);background:var(--hover);color:var(--ink);font-size:.86em;font-weight:500;cursor:pointer;vertical-align:1px}
#editor .cm-board:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
#editor .cm-board .sub{color:var(--dim);font-weight:400}
#editor .cm-board-missing{background:none;color:var(--dim);text-decoration:underline dashed;text-underline-offset:3px;cursor:default}
.st{width:12px;height:12px;display:grid;place-items:center;flex-shrink:0}.st svg{width:12px;height:12px;stroke-width:1.8}
.st.d-idea,.st.d-stall,.st.d-aband{color:var(--dim)}.st.d-run{color:var(--run)}.st.d-wait{color:var(--warn)}.st.d-done{color:var(--ok)}
/* The / menu: the board's menu popover. */
#editor .cm-tooltip.cm-tooltip-autocomplete{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-2);padding:6px;font:13px/1.4 var(--font);animation:fi .12s}
#editor .cm-tooltip-autocomplete>ul{max-height:380px;min-width:220px;font:inherit;scrollbar-color:var(--line) transparent}
#editor .cm-tooltip-autocomplete>ul>li{display:flex;align-items:baseline;gap:10px;padding:7px 10px!important;border-radius:var(--r-s);color:var(--ink)}
#editor .cm-tooltip-autocomplete>ul>li[aria-selected]{background:var(--hover)!important;color:var(--ink)!important}
#editor .cm-completionLabel{flex:1}
#editor .cm-completionDetail{margin:0;font-style:normal;font-size:12px;color:var(--dim)}
#editor .cm-completionMatchedText{text-decoration:none;font-weight:600}
@media(max-width:900px){
 .hdr{padding-inline:16px}
 .wrap{grid-template-columns:1fr}
 .side{display:none;position:fixed;z-index:11;inset:0 auto 0 0;width:min(300px,85vw);border-right:1px solid var(--line);box-shadow:var(--shadow-2)}
 .side-open .side{display:flex}
 .page{padding:24px 16px 30vh}
 .toast{left:16px;max-width:calc(100% - 32px)}
}
@media(min-width:901px){#side{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
