name: test
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # GitHub's release downloads answer 5xx at times (v1.76.0 failed on it): one
      # more try after a pause.
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true
      - if: steps.bun.outcome == 'failure'
        run: sleep 60
      - if: steps.bun.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
