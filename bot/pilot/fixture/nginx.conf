# fixture.test: a local test page for the pilot, plain http only.
server {
  listen 80 default_server;
  root /usr/share/nginx/html;
  location = /redirect-off-list { return 302 https://example.net/; }
  location = /redirect-metadata { return 302 http://169.254.169.254/latest/meta-data/; }
  # Answers 200 to anything, so a probe that gets 200 back from a POST has really written.
  location = /submit { return 200 "received\n"; }
}
