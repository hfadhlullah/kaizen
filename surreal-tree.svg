<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0845"/><stop offset=".55" stop-color="#8e3b8a"/><stop offset="1" stop-color="#ff9a4d"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4d"/><stop offset="1" stop-color="#1b0530"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a0f2e"/><stop offset=".5" stop-color="#4b2a6b"/><stop offset="1" stop-color="#1a0f2e"/>
    </linearGradient>
    <radialGradient id="orb"><stop offset="0" stop-color="#fffbe0"/><stop offset=".4" stop-color="#7ff5e0"/><stop offset="1" stop-color="#7ff5e0" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="tree">
      <path d="M380 700 C330 620 460 570 390 500 C330 440 450 400 400 330 C370 290 420 260 400 230 L420 230 C440 270 395 300 425 335 C480 400 360 450 420 505 C490 570 360 620 420 700 Z" fill="url(#bark)"/>
      <g fill="none" stroke="#3a2058" stroke-width="10" stroke-linecap="round">
        <path d="M405 300 C330 260 300 200 240 210 C200 215 210 260 245 250"/>
        <path d="M412 280 C480 220 540 240 570 180 C590 140 545 130 540 160"/>
        <path d="M400 420 C320 400 260 430 220 380"/>
        <path d="M418 460 C500 440 560 470 600 420"/>
        <path d="M410 240 C400 180 430 140 410 100"/>
      </g>
      <g fill="url(#orb)">
        <circle cx="245" cy="250" r="34"/><circle cx="540" cy="160" r="40"/><circle cx="220" cy="380" r="30"/>
        <circle cx="600" cy="420" r="32"/><circle cx="410" cy="95" r="44"/><circle cx="320" cy="170" r="22"/><circle cx="500" cy="300" r="24"/>
      </g>
      <g fill="#1a0f2e"><circle cx="245" cy="250" r="7"/><circle cx="540" cy="160" r="8"/><circle cx="410" cy="95" r="9"/><circle cx="600" cy="420" r="6"/><circle cx="220" cy="380" r="6"/></g>
    </g>
  </defs>
  <rect width="800" height="700" fill="url(#sky)"/>
  <circle cx="140" cy="140" r="55" fill="#ffe7c2" opacity=".9"/>
  <circle cx="660" cy="110" r="30" fill="#c8f7ff" opacity=".8"/>
  <!-- floating root islands -->
  <ellipse cx="160" cy="560" rx="40" ry="10" fill="#3a2058"/><ellipse cx="660" cy="600" rx="30" ry="8" fill="#3a2058"/>
  <g filter="url(#glow)" opacity=".7"><use href="#tree"/></g>
  <use href="#tree"/>
  <rect y="700" width="800" height="300" fill="url(#water)"/>
  <g transform="translate(0 1400) scale(1 -1)" opacity=".35"><use href="#tree"/></g>
  <path d="M0 700 H800" stroke="#ffe7c2" stroke-width="2" opacity=".6"/>
</svg>
